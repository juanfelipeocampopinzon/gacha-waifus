// Proyecto raíz: solo agrupa los dos loaders.
//
//   ./gradlew build              -> los dos jars
//   ./gradlew :neoforge:build    -> solo NeoForge
//   ./gradlew :fabric:build      -> solo Fabric
//   ./gradlew :neoforge:runClient
//
// El código compartido está en common/src/main y no se compila solo: cada subproyecto lo añade
// como srcDir (ver neoforge/build.gradle y fabric/build.gradle).

plugins {
    id 'base'
}

tasks.named('build') {
    dependsOn ':neoforge:build', ':fabric:build'
}
